on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ezr-survey]
    concurrency:
      group: pkgdown-${{ matrix.package }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: ${{ matrix.package }}
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build the site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
        working-directory: ${{ matrix.package }}

      - name: Publish it under its own folder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ${{ matrix.package }}/docs
          target-folder: ${{ matrix.package }}
          clean: true

  landing:
    runs-on: ubuntu-latest
    needs: pkgdown
    permissions:
      contents: write
    steps:
      # The deploy action needs a git repository to work in, even though the
      # page it publishes is written from scratch below.
      - uses: actions/checkout@v4

      - name: Write the index that lists the packages
        run: |
          mkdir -p root
          cat > root/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>ezr research packages</title>
            <style>
              :root { color-scheme: light dark; --ink: #12314e; --bg: #ffffff; }
              @media (prefers-color-scheme: dark) {
                :root { --ink: #dce4ee; --bg: #12181f; }
              }
              body { background: var(--bg); color: var(--ink);
                     font-family: system-ui, sans-serif; margin: 0;
                     padding: 3rem 1rem; line-height: 1.6; }
              main { max-width: 34rem; margin: 0 auto; }
              h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
              p.lede { opacity: 0.75; margin-top: 0; }
              ul { list-style: none; padding: 0; margin-top: 2rem; }
              li { padding: 0.85rem 0; border-top: 1px solid currentColor; }
              li:last-child { border-bottom: 1px solid currentColor; }
              a { color: inherit; font-weight: 600; }
              span { display: block; font-weight: 400; opacity: 0.75;
                     font-size: 0.95rem; }
            </style>
          </head>
          <body>
            <main>
              <h1>ezr research</h1>
              <p class="lede">R packages for consumer and survey research.</p>
              <ul>
                <li><a href="ezr-survey/">ezrsurvey</a>
                  <span>Single-line helpers for consumer survey analysis.</span></li>
              </ul>
            </main>
          </body>
          </html>
          HTML

      - name: Publish it at the root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: root
          target-folder: .
          clean: false
